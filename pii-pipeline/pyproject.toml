[project]
name = "pii-pipeline"
version = "0.1.0"
description = "Companion repo for the 'Handling PII in Data Pipelines' article series"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.1.0",
    "faker>=28.0.0",
    "pyyaml>=6.0",
    "presidio-analyzer>=2.2.355",
    "en-core-web-sm",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.uv.sources]
en-core-web-sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pii"]
